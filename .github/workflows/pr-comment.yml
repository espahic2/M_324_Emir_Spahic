name: Pull request acknowledgement

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  acknowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge the pull request
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          message: |
            Thank you for the contribution. Exercise 2 linting, formatting and tests are running now.
