name: Repository virus scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clamav-scan:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source for scanning
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan repository contents
        uses: hugoalh/scan-virus-ghaction@99c81e8991ad1074a14e5f22a21bce9be035e14e # v0.20.1
        with:
          clamav_update: "True"
          statistics_summary: "True"
